<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Car Sales Forecast</title>
</head>
<body>
  <h1>Car Sales Forecast</h1>
  <p>Enter the last 6 months of sales to predict next month.</p>

  <form id="predict-form">
    <p>Sales 1 month ago: <input type="number" id="m1" min="0" step="any" required></p>
    <p>Sales 2 months ago: <input type="number" id="m2" min="0" step="any" required></p>
    <p>Sales 3 months ago: <input type="number" id="m3" min="0" step="any" required></p>
    <p>Sales 4 months ago: <input type="number" id="m4" min="0" step="any" required></p>
    <p>Sales 5 months ago: <input type="number" id="m5" min="0" step="any" required></p>
    <p>Sales 6 months ago: <input type="number" id="m6" min="0" step="any" required></p>
    <button type="submit" id="submit-btn">Predict Next Month</button>
  </form>

  <h2 id="result"></h2>

  <script>
    const form = document.getElementById("predict-form");
    const btn = document.getElementById("submit-btn");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      result.textContent = "";

      // Order matters: index 0 = 1 month ago (lag_1), ..., index 5 = 6 months ago (lag_6)
      const sales = [];
      for (let i = 1; i <= 6; i++) {
        sales.push(Number(document.getElementById("m" + i).value));
      }

      btn.disabled = true;
      try {
        const response = await fetch("/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sales })
        });
        const data = await response.json();
        if (!response.ok || data.error) {
          result.textContent = "Error: " + (data.error || data.detail || "Something went wrong.");
        } else {
          result.textContent = "Predicted sales for next month: " + Math.round(data.prediction).toLocaleString();
        }
      } catch (err) {
        result.textContent = "Could not reach the server. Wait a minute and try again.";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
